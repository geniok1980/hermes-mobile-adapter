name: hermes-mobile
label: Mobile App (WebSocket)
kind: platform
version: 1.4.1
requires_hermes: ">=0.21.6"
description: >
  Platform adapter for mobile applications: it runs a WebSocket server inside
  Hermes Agent and the app connects to the agent directly — text, voice, agent
  replies and avatar events (thinking / speaking / idle). The only dependency is
  `websockets` (already shipped with the Hermes environment). Installs itself:
  generates MOBILE_TOKEN when missing and sends a connection card (address + token)
  to the owner's Telegram chat. The app can find the agent on the local network: it
  answers the pre-auth `discover` frame with the agent name, port and path.
  Protocol: site-docs/protocol/index.md.
author: HermesAI (geniok1980)
# ``requires_env`` is shown by ``hermes config`` and ``hermes gateway setup``.
requires_env:
  - name: MOBILE_TOKEN
    description: "App shared secret (authorizes the WebSocket connection)"
    prompt: "App token (openssl rand -hex 32)"
    password: true
# ``optional_env`` — optional settings with defaults.
optional_env:
  - name: MOBILE_HOST
    description: "Listen address. Default is loopback (127.0.0.1); set 0.0.0.0 only deliberately, behind a wss:// reverse proxy."
    prompt: "Host (127.0.0.1)"
    password: false
  - name: MOBILE_PORT
    description: "WebSocket server port (default 8787)"
    prompt: "Port (8787)"
    password: false
  - name: MOBILE_PATH
    description: "WebSocket endpoint path (default /ws)"
    prompt: "Path (/ws)"
    password: false
  - name: MOBILE_AVATAR_URL
    description: "URL of the avatar HTML page the app opens"
    prompt: "Avatar URL"
    password: false
  - name: MOBILE_DISCOVERY
    description: "1/0 — answer the app's pre-auth `discover` frame so the app can find this agent on the local network (default 1; the reply carries the agent name, port and path, never the token)."
    prompt: "Allow finding the agent on the local network? (1/0)"
    password: false
  - name: MOBILE_AUTO_TOKEN
    description: "1/0 — generate MOBILE_TOKEN and save it to the profile .env when it is missing (default 1), so the plugin starts without manual token setup"
    prompt: "Generate the app token automatically? (1/0)"
    password: false
  - name: MOBILE_INVITE
    description: "1/0 — send a one-time connection card (address + token) to the owner's Telegram chat when the token is generated or rotated (default 1; requires TELEGRAM_BOT_TOKEN and TELEGRAM_HOME_CHANNEL)"
    prompt: "Send the connection card to Telegram? (1/0)"
    password: false
  - name: MOBILE_INVITE_CHAT
    description: "Telegram chat for the connection card (default: TELEGRAM_HOME_CHANNEL, then the first allowed user)"
    prompt: "Telegram chat id for the card"
    password: false
  - name: MOBILE_AGENT_NAME
    description: "Name shown in the app's list of agents found on the local network (default: Hermes profile name, then host name)"
    prompt: "Agent name for discovery"
    password: false
  - name: MOBILE_HOME_DEVICE
    description: "Default device for delivery (cron → deliver=mobile)"
    prompt: "Default device id"
    password: false
  - name: MOBILE_ALLOWED_USERS
    description: "Comma-separated user ids — optional restriction. Empty (default): whoever holds the app token is authorized, no pairing. Set it only to limit access to specific devices/users"
    prompt: "Allowed users"
    password: false
  - name: MOBILE_ALLOWED_DEVICES
    description: "Comma-separated device ids — an extra adapter-level filter (empty = any device with a valid token)"
    prompt: "Allowed devices"
    password: false
  - name: MOBILE_ALLOW_ALL_USERS
    description: "Kept for compatibility: with an empty MOBILE_ALLOWED_USERS access by token is already open. Set it to 1 only for clarity in configs that list every switch."
    prompt: "Allow all users? (1/0)"
    password: false
  - name: MOBILE_EXTRA_TOKENS
    description: "Additional tokens (pairing several devices), comma-separated. An entry may be `device_id=token` to bind a token to one device, so it cannot take over another device id."
    prompt: "Extra tokens"
    password: true
  - name: MOBILE_DELIVER_TOKENS
    description: "Comma-separated tokens allowed to send the service `deliver` frame (cron from another process or host). From a loopback address delivery is allowed without it."
    prompt: "Deliver tokens"
    password: true
