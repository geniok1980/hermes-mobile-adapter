name: docs

# Сборка сайта документации (MkDocs Material из site-docs/) и публикация на GitHub Pages.
# Адрес после публикации: https://geniok1980.github.io/hermes-mobile-adapter/

on:
  push:
    branches: [main]
    paths:
      - 'site-docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить MkDocs Material
        run: pip install -r docs-requirements.txt

      - name: Проверить исходники документации
        run: python3 scripts/check-docs.py

      - name: Собрать сайт
        run: mkdocs build -d site --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
