name: tests

# Прогоняется, когда меняется код адаптера, SDK или сами тесты: правки только в
# документации проверяет workflow docs.
on:
  push:
    branches: [main]
    paths:
      - 'adapter/**'
      - 'sdk/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  adapter-tests:
    # Тесты поднимают настоящий WebSocket-сервер адаптера и требуют Hermes Agent
    # (платформенный API: gateway.*).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install "websockets>=12"

      - name: Кэш установки Hermes Agent
        uses: actions/cache@v4
        with:
          path: ~/.hermes/hermes-agent
          key: hermes-agent-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            hermes-agent-${{ runner.os }}-

      # Установщик Hermes делает editable-установку пакета hermes_agent в собственное
      # окружение. Тесты поэтому идут питоном ЭТОГО окружения: с системным интерпретатором
      # `import gateway` не находится, и часть тестов молча не проверяется.
      - name: Hermes Agent (платформенный API)
        run: |
          DIR="$HOME/.hermes/hermes-agent"
          if [ ! -d "$DIR/gateway" ]; then
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
              | bash -s -- --non-interactive --skip-browser --skip-computer-use
          fi
          PY="$DIR/venv/bin/python"
          if [ ! -x "$PY" ]; then
            echo "::error::окружение Hermes не найдено: $PY"
            exit 1
          fi
          echo "HERMES_PY=$PY" >> "$GITHUB_ENV"
          "$PY" -c "import websockets" 2>/dev/null \
            || "$PY" -m pip install -q "websockets>=12"
          # Проверка платформенного API обязательна: без неё часть тестов проходит «мимо».
          "$PY" -c "import gateway.config, gateway.platform_registry; print('Hermes API подключён')"

      - name: Тесты протокола и адаптера
        run: |
          "$HERMES_PY" -m unittest discover -s tests -v

      - name: Типчек TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --silent
          npx tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution bundler hermesClient.ts
