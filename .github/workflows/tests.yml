name: tests

# Прогоняется, когда меняется код адаптера, SDK или сами тесты: правки только в
# документации проверяет workflow docs.
on:
  push:
    branches: [main]
    paths:
      - 'adapter/**'
      - 'sdk/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  adapter-tests:
    # Тесты поднимают настоящий WebSocket-сервер адаптера и требуют Hermes Agent
    # (платформенный API: gateway.*).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install "websockets>=12" pyyaml

      - name: Кэш установки Hermes Agent
        uses: actions/cache@v4
        with:
          path: ~/.hermes/hermes-agent
          key: hermes-agent-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            hermes-agent-${{ runner.os }}-

      # Платформенный API (gateway.*) — модули из чекаута Hermes, поэтому его корень идёт
      # на PYTHONPATH. Внутреннее окружение установщика не используем: его расположение
      # зависит от версии установщика, а тестам нужны только gateway.* и их прямые
      # зависимости (pyyaml + websockets).
      - name: Hermes Agent (платформенный API)
        run: |
          DIR="$HOME/.hermes/hermes-agent"
          if [ ! -d "$DIR/gateway" ]; then
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
              | bash -s -- --non-interactive --skip-browser --skip-computer-use
          fi
          echo "HERMES_DIR=$DIR" >> "$GITHUB_ENV"
          # Проверка обязательна: без неё часть тестов проходит «мимо» платформенного API.
          PYTHONPATH="$DIR" python -c "import gateway.config, gateway.platform_registry; print('Hermes API подключён')"

      - name: Тесты протокола и адаптера
        env:
          PYTHONPATH: ${{ env.HERMES_DIR }}
        run: |
          python -m unittest discover -s tests -v

      - name: Типчек TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --silent
          npx tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution bundler hermesClient.ts
