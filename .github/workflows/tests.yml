name: tests

# Прогоняется, когда меняется код адаптера, SDK или сами тесты: правки только в
# документации проверяет workflow docs.
on:
  push:
    branches: [main]
    paths:
      - 'adapter/**'
      - 'sdk/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  adapter-tests:
    # Тесты поднимают настоящий WebSocket-сервер адаптера и требуют Hermes Agent
    # (платформенный API: gateway.*).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install "websockets>=12" pyyaml "ruamel.yaml"

      - name: Кэш установки Hermes Agent
        uses: actions/cache@v4
        with:
          path: ~/.hermes/hermes-agent
          key: hermes-agent-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            hermes-agent-${{ runner.os }}-

      # Платформенный API (gateway.*) импортируется только тем интерпретатором, где стоят
      # зависимости Hermes (у установщика это своё окружение). Поэтому не угадываем путь,
      # а ищем работоспособный интерпретатор: сначала окружения установщика, затем системный
      # Python с нашими зависимостями. Если ни один не может импортировать API — падаем
      # здесь, а не «мимо» тестов.
      - name: Hermes Agent (платформенный API)
        run: |
          DIR="$HOME/.hermes/hermes-agent"
          if [ ! -d "$DIR/gateway" ]; then
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
              | bash -s -- --non-interactive --skip-browser --skip-computer-use
          fi
          echo "HERMES_DIR=$DIR" >> "$GITHUB_ENV"
          echo "кандидаты-интерпретаторы:"
          find "$HOME/.hermes" "$RUNNER_WORKSPACE" "$HOME" -maxdepth 5 -type f -name 'python3*' -path '*/bin/*' 2>/dev/null | head -20
          CANDIDATES="$(find "$HOME/.hermes" "$RUNNER_WORKSPACE" -maxdepth 5 -type f -name 'python3*' -path '*/bin/*' 2>/dev/null) $(command -v python3)"
          for PY in $CANDIDATES; do
            [ -x "$PY" ] || continue
            if PYTHONPATH="$DIR" "$PY" -c "import gateway.config, gateway.platform_registry" 2>/dev/null; then
              echo "HERMES_PY=$PY" >> "$GITHUB_ENV"
              echo "интерпретатор с платформенным API: $PY"
              PYTHONPATH="$DIR" "$PY" -c "import gateway.platform_registry as r; print('Hermes API:', r.__file__)"
              exit 0
            fi
          done
          echo "::error::ни один интерпретатор не смог импортировать gateway.* (каталог: $DIR)"
          exit 1

      - name: Тесты протокола и адаптера
        env:
          PYTHONPATH: ${{ env.HERMES_DIR }}
        run: |
          "${HERMES_PY:-$(command -v python3)}" -m unittest discover -s tests -v

      - name: Типчек TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --silent
          npx tsc --noEmit --strict --target ES2020 --module ESNext --moduleResolution bundler hermesClient.ts
